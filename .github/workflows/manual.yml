# This is a basic workflow that is manually triggered

name: Node.js CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Install dependencies
        run: npm install
      - run: node datagetter/crawler.js
      - run: node datagetter/extrakter.js
      - run: node datagetter/pricegetter.js
